<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Progress">
<meta name="theme-color" content="#f6f4ef">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--muted:#6f6c66;--line:#e6e2d9;
  --pos:#2f8f5b;--pos-bg:#e3f3ea;--neg:#c2512a;--neg-bg:#fbe5da;--task:#3a6ec2;--task-bg:#e4ecf9;
  --accent:#1d1d1b;--r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#211f1d;--ink:#f1eee8;--muted:#a39f97;--line:#34312d;
  --pos:#5cc48a;--pos-bg:#1f3529;--neg:#ee8a5e;--neg-bg:#3b261d;--task:#7aa4ee;--task-bg:#1f2a3d;--accent:#f1eee8}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--muted);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.kind button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 4px;font-weight:600;font-size:14px}
.kind button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.pts{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.pts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 0;font-weight:700;font-size:15px}
.pts button.n.on{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.pts button.p.on{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.pts button.z.on{background:var(--line);border-color:var(--muted);color:var(--ink)}
.badge.z{background:var(--line);color:var(--muted)}
.chips.quick .chip{border-style:dashed;font-size:13px;padding:5px 11px}
.quickline{display:flex;align-items:center;gap:6px;padding:2px 0 2px 32px;font-size:13px;color:var(--muted)}
.quickline .tx{flex:1}
.ptsel{width:auto!important;padding:5px 6px!important;font-size:13px!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chips.subs .chip{font-size:13px;padding:5px 11px}
.chips.subs .chip.on{background:var(--muted);border-color:var(--muted)}
input[type=text],textarea,input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:44px}
.btn{border:0;background:var(--accent);color:var(--bg);font-weight:600;font-size:15px;border-radius:10px;padding:11px 16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.35}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px}
.datebar .d{flex:1;text-align:center;font-weight:600}
.datebar .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.score{font-weight:700}
.score.p{color:var(--pos)}.score.n{color:var(--neg)}.score.z{color:var(--muted)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ver{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 6px}
.btn.ok{background:var(--pos);color:#fff;transition:background .2s}
[data-act="add"]{white-space:nowrap;min-width:92px}
.item.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--pos-bg)}100%{background:transparent}}
.runlist .item{align-items:center}
.runlist .tm{flex:none;width:58px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .tx{cursor:pointer}
.edit{flex:none;border:0;background:transparent;color:var(--muted);font-size:16px;padding:0 2px;margin-top:-1px;line-height:1.4}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cols .card{padding:4px 10px;margin:0}
.cols .item{gap:7px;font-size:15px}
.cols .badge{min-width:28px;font-size:13px}
.colhead{font-size:12px;font-weight:700;padding:8px 2px 2px}
.colhead.n{color:var(--neg)}.colhead.p{color:var(--pos)}
.cols .empty{font-size:13px;padding:8px 2px}
.subcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subcols>div{min-width:0}
.badge{flex:none;min-width:34px;text-align:center;border-radius:8px;padding:2px 0;font-weight:700;font-size:14px}
.badge.p{background:var(--pos-bg);color:var(--pos)}.badge.n{background:var(--neg-bg);color:var(--neg)}
.badge.pend{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.item .tx{flex:1;min-width:0;word-wrap:break-word}
.item .meta{font-size:12px;color:var(--muted)}
.item.done .tx>span{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--task);background:transparent;margin-top:1px;color:#fff;font-size:14px;line-height:18px;padding:0}
.chk.on{background:var(--task)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat small{color:var(--muted);font-size:12px}
.dv{display:flex;height:12px;align-items:center}
.dv .l,.dv .r{flex:1;display:flex;height:100%}
.dv .l{justify-content:flex-end;border-right:1.5px solid var(--muted)}
.dv i{display:block;height:100%}
.dv .l i{background:var(--neg);border-radius:6px 0 0 6px}
.dv .r i{background:var(--pos);border-radius:0 6px 6px 0}
.catrow{padding:9px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .row{justify-content:space-between;font-size:14px;margin-bottom:5px}
.catrow.subrow{padding:6px 0 6px 14px;border-top:0}
.catrow.subrow .row{font-size:13px;color:var(--muted)}
.catrow.subrow .dv{height:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:17px}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{flex:1;min-width:0}
.dayhead{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;justify-content:space-between}
.rng{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.rng button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0;font-size:14px}
.rng button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.cathead{display:flex;align-items:center;gap:6px;padding:10px 0 6px}
.cathead .tx{flex:1;font-weight:600}
.subline{display:flex;align-items:center;gap:6px;padding:4px 0 4px 16px;font-size:14px}
.subline .tx{flex:1;color:var(--muted)}
.catblock{border-top:1px solid var(--line);padding-bottom:6px}
.catblock:first-child{border-top:0}
svg text{fill:var(--muted);font-size:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Progress Log</h1>
  <div class="sub" id="status">Connecting…</div>
  <div id="view"></div>
</div>

<nav>
  <button data-v="today" class="on"><span>✎</span>Log</button>
  <button data-v="history"><span>☰</span>History</button>
  <button data-v="progress"><span>↗</span>Progress</button>
  <button data-v="settings"><span>⚙</span>Setup</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
const PTS=[3,2,1,0,-1,-2,-3];
const BASE_PTS=1; /* default score unless a subcategory sets its own */
const STEWARDSHIP={name:"Stewardship",subs:["Money","Home","Family"],subPts:{},items:{Family:[{name:"Fun activity",pts:1},{name:"Lunches",pts:1},{name:"Drop/pick up",pts:1},{name:"Arrange babysitter",pts:2}],Money:[{name:"Payday update",pts:1,dates:[5,20]},{name:"Missed payment",pts:-2}],Home:[{name:"Clean",pts:1},{name:"Dishes",pts:1},{name:"Trash",pts:1,days:[3]}]}};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function ord(n){const t=n%100;return n+((t>10&&t<14)?"th":["th","st","nd","rd"][n%10]||"th")}
const RELATIONSHIP={name:"Relationship",subs:["Connection","Intimacy"],subPts:{},items:{Connection:[{name:"Date",pts:1},{name:"Cuddle",pts:1},{name:"Flirt",pts:1}],Intimacy:[{name:"Fucking",pts:1}]}};
const LEADERSHIP={name:"Leadership",subs:["TCB","Praise","Snap","Boundary","Veg"],subPts:{Snap:-1,Veg:-1},items:{}};
const DEFAULT_CATS=[
  {name:"Vitality",subs:["Sleep","Fitness","Weight","Grooming","Other"],subPts:{Sleep:1},items:{}},
  clone(STEWARDSHIP),clone(LEADERSHIP),clone(RELATIONSHIP),
  {name:"Work",subs:["Up to date","Building","TCB","Other"],subPts:{},items:{}}
];
const S={db:null,col:null,ready:false,days:{},cats:clone(DEFAULT_CATS),
  view:"today",date:ymd(new Date()),kind:"log",pts:1,cat:"Vitality",sub:"",range:30,fSign:"all",fCat:"all",q:"",open:{}};

function clone(o){return JSON.parse(JSON.stringify(o))}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function today(){return ymd(new Date())}
function nice(s,opt){return parse(s).toLocaleDateString(undefined,opt||{weekday:"short",month:"short",day:"numeric"})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function $(id){return document.getElementById(id)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800)}
function entries(d){return S.days[d]||[]}
function sgn(n){return n>0?"+"+n:n<0?"−"+(-n):"0"}
function cls(n){return n>0?"p":n<0?"n":"z"}
function ptsButtons(cur,act){return PTS.map(p=>`<button class="${cls(p)} ${cur===p?"on":""}" ${act}="pts" data-p="${p}">${sgn(p)}</button>`).join("")}
function catObj(name){return S.cats.find(c=>c.name===name)}
function label(e){return e.sub?e.cat+" › "+e.sub:e.cat}
function title(e){return e.text||e.sub||e.cat}
function counted(e){return e.pts}

/* normalize older entries (win/task/blunder) into the scored model */
function norm(e){
  const o=Object.assign({},e);
  o.kind="log";delete o.done;delete o.doneOn; /* tasks were removed: any old ones become ordinary entries */
  if(typeof o.pts!=="number"){o.pts=o.type==="blunder"?-1:1}
  if(o.sub==null)o.sub="";
  delete o.type;return o;
}
function normCats(arr){
  return arr.map(c=>{if(typeof c==="string")c={name:c};
    const o={name:String(c.name||""),subs:Array.isArray(c.subs)?c.subs.map(String):[],subPts:{},items:{}};
    if(c.subPts&&typeof c.subPts==="object")for(const k in c.subPts)if(typeof c.subPts[k]==="number")o.subPts[k]=c.subPts[k];
    if(c.items&&typeof c.items==="object")for(const k in c.items)if(Array.isArray(c.items[k]))o.items[k]=c.items[k].filter(x=>x&&x.name).map(x=>{const q={name:String(x.name),pts:typeof x.pts==="number"?x.pts:BASE_PTS};if(Array.isArray(x.days)&&x.days.length)q.days=x.days.filter(n=>n>=0&&n<=6);if(Array.isArray(x.dates)&&x.dates.length)q.dates=x.dates.filter(n=>n>=1&&n<=31);return q});
    return o}).filter(c=>c.name);
}
function defPts(cat,sub){const c=catObj(cat);return c&&c.subPts&&typeof c.subPts[sub]==="number"?c.subPts[sub]:BASE_PTS}
function quickItems(cat,sub,all){const c=catObj(cat);const list=(c&&c.items&&c.items[sub])||[];if(all)return list;const dt=parse(S.date),wd=dt.getDay(),md=dt.getDate();return list.filter(q=>(!q.days||q.days.includes(wd))&&(!q.dates||q.dates.includes(md)))}

/* ---------- storage (this device) ---------- */
const LS="progresslog.v2";
/* L.dirty = days changed here but not yet confirmed by cloud sync */
const L={dirty:{},catsDirty:false};
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({days:S.days,cats:S.cats,catsV:CATS_V,dirty:L.dirty,catsDirty:L.catsDirty,savedAt:Date.now()}));S.lsOK=true;return true}catch(e){S.lsOK=false;return false}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"null");S.lsOK=true;if(!o)return;
  if(o.dirty&&typeof o.dirty==="object")L.dirty=o.dirty;L.catsDirty=!!o.catsDirty;
  if(o.days&&typeof o.days==="object")for(const d in o.days)if(Array.isArray(o.days[d])&&o.days[d].length)S.days[d]=o.days[d].map(norm);
  if(Array.isArray(o.cats)&&o.cats.length){S.cats=normCats(o.cats);migrateAll(o.catsV||0)}
  }catch(e){}}
const CATS_V=11;
const APP_VERSION="11.16.2026.4"; /* MM.DD.YYYY.N — date of release, N = release number that day */
/* bring an older category list (and entries that used old categories) up to date */
function migrateAll(from){
  if(from>=CATS_V)return;
  if(from<3){const v=S.cats.find(c=>c.name==="Vitality");
    if(v){if(!v.subs.includes("Sleep"))v.subs.unshift("Sleep");if(!v.subs.includes("Other"))v.subs.push("Other")}}
  if(from<4)migrate4();
  if(from<5)migrate5();
  if(from<6){const st=S.cats.find(c=>c.name==="Stewardship");
    if(st&&st.subs.includes("Home")){const l=st.items.Home||(st.items.Home=[]);if(!l.some(q=>q.name==="Trash"))l.push({name:"Trash",pts:1,days:[3]})}}
  if(from<7){const st=S.cats.find(c=>c.name==="Stewardship");
    if(st&&st.subs.includes("Home")){const l=st.items.Home||(st.items.Home=[]);
      ["Dishes","Clean"].forEach(n=>{if(!l.some(q=>q.name===n))l.unshift({name:n,pts:1})})}}
  /* v11: Relationship (Connection, Intimacy) after Leadership */
  if(from<11&&!S.cats.some(c=>c.name==="Relationship")){
    const li=S.cats.findIndex(c=>c.name==="Leadership");S.cats.splice(li>-1?li+1:S.cats.length,0,clone(RELATIONSHIP))}
  /* v10: Work subcategories (all +1); Veg (−1) under Leadership */
  if(from<10){
    const ld=S.cats.find(c=>c.name==="Leadership");
    if(ld){if(!ld.subs.includes("Veg"))ld.subs.push("Veg");if(typeof ld.subPts.Veg!=="number")ld.subPts.Veg=-1}
    let wk=S.cats.find(c=>c.name==="Work");
    if(!wk){wk={name:"Work",subs:[],subPts:{},items:{}};S.cats.push(wk)}
    ["Up to date","Building","TCB"].forEach(x=>{if(!wk.subs.includes(x))wk.subs.push(x)});
    wk.subs=wk.subs.filter(x=>x!=="Other").concat(["Other"]);
  }
  /* v9: Leadership subcategories (Snap starts at −1, the rest at +1) */
  if(from<9){const ld=S.cats.find(c=>c.name==="Leadership");
    if(ld){["TCB","Praise","Snap","Boundary"].forEach(x=>{if(!ld.subs.includes(x))ld.subs.push(x)});if(typeof ld.subPts.Snap!=="number")ld.subPts.Snap=-1}}
  /* v8: Payday update only on the 5th and 20th; Family moves under Stewardship with its quick entries */
  if(from<8){const st=S.cats.find(c=>c.name==="Stewardship");
    if(st){
      const pd=(st.items.Money||[]).find(q=>q.name==="Payday update");if(pd&&!pd.dates)pd.dates=[5,20];
      if(!st.subs.includes("Family"))st.subs.push("Family");
      const fi=S.cats.findIndex(c=>c.name==="Family");
      if(fi>-1){S.cats[fi].subs.forEach(x=>{if(!st.subs.includes(x))st.subs.push(x)});S.cats.splice(fi,1)}
      moveEntries("Family","Stewardship","Family");
      const l=st.items.Family||(st.items.Family=[]);
      [{name:"Fun activity",pts:1},{name:"Lunches",pts:1},{name:"Drop/pick up",pts:1},{name:"Arrange babysitter",pts:2}].forEach(q=>{if(!l.some(x=>x.name===q.name))l.push(q)});
    }}
  L.catsDirty=true;lsSave();
}
function moveEntries(fromCat,toCat,defSub){
  for(const d in S.days)if(S.days[d].some(e=>e.cat===fromCat)){
    S.days[d]=S.days[d].map(e=>e.cat===fromCat?Object.assign({},e,{cat:toCat,sub:e.sub||defSub}):e);L.dirty[d]=1}
}
/* v5: drop Mind and Learning (old entries keep their labels); Home moves under Stewardship */
function migrate5(){
  S.cats=S.cats.filter(c=>c.name!=="Mind"&&c.name!=="Learning");
  const st=S.cats.find(c=>c.name==="Stewardship");
  if(st){
    const hi=S.cats.findIndex(c=>c.name==="Home");
    if(!st.subs.includes("Home"))st.subs.push("Home");
    if(hi>-1){S.cats[hi].subs.forEach(x=>{if(!st.subs.includes(x))st.subs.push(x)});S.cats.splice(hi,1)}
    moveEntries("Home","Stewardship","Home");
  }
}
/* v4: Sleep defaults to +1; Money moves under Stewardship; add Leadership */
function migrate4(){
  const v=S.cats.find(c=>c.name==="Vitality");if(v&&typeof v.subPts.Sleep!=="number")v.subPts.Sleep=1;
  let st=S.cats.find(c=>c.name==="Stewardship");
  if(!st){st=clone(STEWARDSHIP);const vi=S.cats.indexOf(v);S.cats.splice(vi>-1?vi+1:0,0,st)}
  else{if(!st.subs.includes("Money"))st.subs.unshift("Money");if(!st.items.Money)st.items.Money=clone(STEWARDSHIP.items.Money)}
  const mi=S.cats.findIndex(c=>c.name==="Money");
  if(mi>-1){S.cats[mi].subs.forEach(x=>{if(!st.subs.includes(x))st.subs.push(x)});S.cats.splice(mi,1)}
  moveEntries("Money","Stewardship","Money");
  if(!S.cats.some(c=>c.name==="Leadership"))S.cats.splice(S.cats.indexOf(st)+1,0,clone(LEADERSHIP));
}
/* ---------- cloud sync (your Claude account), when this view allows it ---------- */
const queues={};
function queueWrite(id,fn){
  const prev=queues[id]||Promise.resolve();
  const next=prev.then(fn).catch(e=>{
    if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(fn).catch(()=>syncFail());
    syncFail(e);
  });
  queues[id]=next;return next;
}
function syncFail(e){S.sync=e&&e.code==="quota_exceeded"?"full":"error";render();toast(S.sync==="full"?"Cloud storage is full":"Couldn't sync — kept on this device")}
function pushDay(d){
  const list=entries(d).slice();const ref=S.col.doc(d);
  return queueWrite(d,()=>(list.length?ref.set({date:d,entries:clone(list)}):ref.delete()).then(()=>{
    if(JSON.stringify(entries(d))===JSON.stringify(list)){delete L.dirty[d];lsSave()}}));
}
function pushCats(){
  const c=clone(S.cats);const ref=S.col.doc("settings");
  return queueWrite("settings",()=>ref.set({categories:c,catsV:CATS_V}).then(()=>{if(JSON.stringify(S.cats)===JSON.stringify(c)){L.catsDirty=false;lsSave()}}));
}
function saveDay(d){if(!entries(d).length)delete S.days[d];L.dirty[d]=1;lsSave();if(S.col&&S.ready)pushDay(d);afterSave()}
function saveCats(){L.catsDirty=true;lsSave();if(S.col&&S.ready)pushCats();afterSave()}
function afterSave(){if(!S.lsOK&&S.sync!=="on")toast("⚠️ Not saved — this view can't store entries")}
async function init(){
  S.sync="connecting";lsLoad();fixSel();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let db=null,user=null;
  try{if(window.claude&&window.claude.use)[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  let id=null;if(db&&user){try{id=await user.id()}catch(e){}}
  if(!db||!id){S.sync="off";render();return}
  const timer=setTimeout(()=>{if(!S.ready){S.sync="off";render()}},10000);
  S.col=db.collection("data/users/"+id);
  S.col.onSnapshot(snap=>{
    const days={};let cats=null,cloudV=0;
    snap.docs.forEach(doc=>{const v=doc.data()||{};
      if(doc.id==="settings"){if(Array.isArray(v.categories)&&v.categories.length){cats=normCats(v.categories);cloudV=v.catsV||0}}
      else if(Array.isArray(v.entries))days[doc.id]=v.entries.map(norm)});
    /* days changed here and not yet uploaded win over the cloud copy */
    for(const d in L.dirty)days[d]=entries(d);
    for(const d in days)if(!days[d].length)delete days[d];
    S.days=days;
    if(cats&&!L.catsDirty){S.cats=cats;if(cloudV<CATS_V)migrateAll(cloudV)}else if(!cats)L.catsDirty=true;
    fixSel();lsSave();
    if(!snap.metadata.fromCache){
      clearTimeout(timer);const first=!S.ready;S.ready=true;S.sync="on";
      if(first){Object.keys(L.dirty).forEach(pushDay);if(L.catsDirty)pushCats()}
    }
    render();
  },()=>{clearTimeout(timer);S.sync="error";render()});
}
function fixSel(){
  const c=catObj(S.cat)||S.cats[0];S.cat=c?c.name:"";
  if(!c||!c.subs.length)S.sub="";else if(!c.subs.includes(S.sub))S.sub=c.subs[0];
}
function setStatus(t){
  const standalone=!window.claude; /* opened outside Claude, e.g. GitHub Pages: on-device storage is the normal mode */
  const mode=S.sync==="on"?"☁︎ Synced":S.sync==="connecting"&&!standalone?"Connecting…":S.lsOK?(standalone?"📱 Saved on this device":"⚠️ Saved on this device only"):"⚠️ Not saving in this view";
  const el=$("status");el.textContent=mode+" · "+t;el.style.color=mode.startsWith("⚠️")?"var(--neg)":""}

/* ---------- mutations ---------- */
function addEntry(){
  const ta=$("txt");const text=ta.value.trim();
  if(!S.cat){toast("Add a category in Setup first");return}
  const e={id:nid(),kind:S.kind,pts:S.pts,cat:S.cat,sub:S.sub,text,t:Date.now()};
  S.days[S.date]=entries(S.date).concat([e]);saveDay(S.date);
  S.justAdded=e.id;clearTimeout(addEntry._t);
  ta.value="";render();toast(`✓ ${sgn(e.pts)} saved · ${label(e)}`);
  try{navigator.vibrate&&navigator.vibrate(30)}catch(err){}
  addEntry._t=setTimeout(()=>{S.justAdded=null;const b=document.querySelector('[data-act="add"]');if(b){b.classList.remove("ok");b.textContent="Add"}
    document.querySelectorAll(".item.new").forEach(x=>x.classList.remove("new"))},1600);
  const r=document.querySelector(".runlist");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function findEntry(id){for(const d in S.days){const i=S.days[d].findIndex(e=>e.id===id);if(i>-1)return{d,i,e:S.days[d][i]}}return null}
function toggleTask(id){
  const f=findEntry(id);if(!f)return;
  const e=Object.assign({},f.e);e.done=!e.done;if(e.done)e.doneOn=today();else delete e.doneOn;
  S.days[f.d]=S.days[f.d].slice();S.days[f.d][f.i]=e;saveDay(f.d);render();
  if(e.done)toast(sgn(e.pts)+" earned");
}
function remapEntries(match,change){
  for(const d in S.days){if(S.days[d].some(match)){S.days[d]=S.days[d].map(e=>match(e)?Object.assign({},e,change(e)):e);saveDay(d)}}
}

/* ---------- stats ---------- */
function streak(){let d=today();if(!entries(d).length)d=addDays(d,-1);let n=0;while(entries(d).length){n++;d=addDays(d,-1)}return n}
function inRange(n){const from=addDays(today(),-(n-1)),to=today();return Object.keys(S.days).filter(d=>d>=from&&d<=to)}
function sumRange(n){let s=0;inRange(n).forEach(d=>S.days[d].forEach(e=>s+=counted(e)));return s}
function dayScore(d){return entries(d).reduce((s,e)=>s+counted(e),0)}

function catOptions(sel,withAll){

function allCats(){

  const rows=Object.entries(cats).sort((a,b)=>(b[1].pos+b[1].neg)-(a[1].pos+a[1].neg));

  });

function weekChart(){
  const dow=(parse(today()).getDay()+6)%7;const monday=addDays(today(),-dow);
  const weeks=[];for(let i=11;i>=0;i--){const s=addDays(monday,-7*i);const w={s,pos:0,neg:0};
    for(let k=0;k<7;k++)entries(addDays(s,k)).forEach(e=>{const v=counted(e);if(v>0)w.pos+=v;else w.neg-=v});weeks.push(w)}
  const max=Math.max(1,...weeks.map(w=>Math.max(w.pos,w.neg)));
  const W=320,top=8,mid=78,half=62,H=mid+half+4,gw=(W-24)/12,bw=Math.min(14,gw-6),x0=22;
  const y=v=>mid-v/max*half;
  let s=`<svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="Weekly points gained and lost">`;
  s+=`<line x1="${x0}" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
  s+=`<text x="0" y="${y(max)+4}">+${max}</text><text x="0" y="${mid+3}">0</text><text x="0" y="${y(-max)+2}">−${max}</text>`;
  const pts=[];
  weeks.forEach((w,i)=>{const cx=x0+i*gw+gw/2,bx=cx-bw/2;
    if(w.pos)s+=`<rect x="${bx}" y="${y(w.pos)}" width="${bw}" height="${mid-y(w.pos)}" rx="2" fill="var(--pos)"><title>Week of ${nice(w.s,{month:"short",day:"numeric"})}: +${w.pos}</title></rect>`;
    if(w.neg)s+=`<rect x="${bx}" y="${mid}" width="${bw}" height="${y(-w.neg)-mid}" rx="2" fill="var(--neg)"><title>Week of ${nice(w.s,{month:"short",day:"numeric"})}: −${w.neg}</title></rect>`;
    pts.push(cx+","+y(w.pos-w.neg));
    if(i%3===0||i===11)s+=`<text x="${cx}" y="${H+12}" text-anchor="middle">${i===11?"This wk":nice(w.s,{month:"numeric",day:"numeric"})}</text>`;
  });
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>`;
  pts.forEach(p=>{const[a,b]=p.split(",");s+=`<circle cx="${a}" cy="${b}" r="2.4" fill="var(--ink)"/>`});
  return s+`</svg>`;
}

  h+=`</div><div class="row" style="margin-bottom:16px"><input type="text" id="newcat" placeholder="New category"><button class="btn" data-act="addcat">Add</button></div>`;
  h+=`<div class="sec"><span>How points work</span></div><div class="note" style="margin-bottom:12px">Score each entry from +3 to −3 (0 for neutral). New entries start at +1 unless the subcategory has its own default, and quick entries (like Payday update) fill in their text and points. Everything rolls up into daily, weekly and per-category totals.</div>`;
  h+=`<div class="sec"><span>Backup &amp; restore</span></div><div class="card"><div style="font-size:14px;color:var(--muted);margin-bottom:10px">Your log lives in this browser on this device. Download a backup now and then (or after a big week) — restore it here or on a new phone.${lastBackup()}</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="backup">Download backup</button>
    <button class="btn ghost" data-act="restore">Restore</button><button class="btn ghost" data-act="csv">Download CSV</button></div>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></div>
    <div class="note">Tip: add this page to your home screen (Share → Add to Home Screen) for one-tap logging. Always open it from the same browser so it finds your entries.</div>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html){$("sheet").innerHTML=html;$("sheetBg").classList.add("show")}
function closeSheet(){$("sheetBg").classList.remove("show")}
function subSelect(cat,sel){const c=allCats().find(x=>x.name===cat);const subs=c?c.subs:[];
  return (!subs.length||sel===""?`<option value="">—</option>`:"")+subs.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
function editSheet(id){
  const f=findEntry(id);if(!f)return;const e=f.e;
  openSheet(`<h3>Edit entry</h3>
    <div class="pts">${ptsButtons(e.pts,"data-sact").replace(/="pts"/g,'="epts"')}</div>
    <div class="row" style="margin-bottom:10px"><select id="ecat">${allCats().map(c=>`<option ${c.name===e.cat?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    <select id="esub">${subSelect(e.cat,e.sub)}</select></div>
    <textarea id="etxt" rows="3" placeholder="Comment" style="margin-bottom:10px">${esc(e.text)}</textarea>
    <input type="date" id="edate" value="${f.d}" max="${today()}" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between"><button class="btn danger" data-sact="del">Delete</button>
    <div class="row"><button class="btn ghost" data-sact="close">Cancel</button><button class="btn" data-sact="save">Save</button></div></div>`);
  const sh=$("sheet");sh.dataset.id=id;sh.dataset.kind=e.kind;sh.dataset.pts=e.pts;
  $("ecat").addEventListener("change",()=>{$("esub").innerHTML=subSelect($("ecat").value,"")});
}
function textSheet(title,val,cb){
  openSheet(`<h3>${esc(title)}</h3><input type="text" id="stxt" value="${esc(val)}" style="margin-bottom:12px">
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-sact="close">Cancel</button><button class="btn" data-sact="ok">Save</button></div>`);
  textSheet.cb=cb;setTimeout(()=>$("stxt").focus(),50);
}
function quickSheet(i,j){
  openSheet(`<h3>Quick entry for ${esc(S.cats[i].subs[j])}</h3><input type="text" id="qname" placeholder="e.g. Payday update" style="margin-bottom:10px">
    <div class="pts">${ptsButtons(BASE_PTS,"data-sact").replace(/="pts"/g,'="epts"')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-sact="close">Cancel</button><button class="btn" data-sact="quickok">Save</button></div>`);
  const sh=$("sheet");sh.dataset.pts=BASE_PTS;sh.dataset.i=i;sh.dataset.j=j;setTimeout(()=>$("qname").focus(),50);
}
function confirmSheet(msg,cb){
  openSheet(`<h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-sact="close">Cancel</button><button class="btn danger" data-sact="yes">Remove</button></div>`);
  confirmSheet.cb=cb;
}
$("sheetBg").addEventListener("keydown",ev=>{if(ev.target.id==="stxt"&&ev.key==="Enter"){ev.preventDefault();$("sheet").querySelector('[data-sact="ok"]').click()}});
$("sheetBg").addEventListener("click",ev=>{
  if(ev.target===$("sheetBg"))return closeSheet();
  const b=ev.target.closest("[data-sact]");if(!b)return;const a=b.dataset.sact;const sh=$("sheet");
  if(a==="close")return closeSheet();
  if(a==="ekind"){sh.dataset.kind=b.dataset.k;sh.querySelectorAll(".kind button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(a==="epts"){sh.dataset.pts=b.dataset.p;sh.querySelectorAll(".pts button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(a==="ok"){const v=$("stxt").value.trim();if(v&&!/›/.test(v))textSheet.cb(v);return closeSheet()}
  if(a==="yes"){confirmSheet.cb();return closeSheet()}
  if(a==="quickok"){const nm=$("qname").value.trim();if(!nm)return;const i=+sh.dataset.i,j=+sh.dataset.j;const c=clone(S.cats);const sub=c[i].subs[j];
    (c[i].items[sub]=c[i].items[sub]||[]).push({name:nm,pts:+sh.dataset.pts});closeSheet();return setCats(c)}
  const f=findEntry(sh.dataset.id);if(!f)return closeSheet();
  if(a==="del"){S.days[f.d]=S.days[f.d].filter(x=>x.id!==f.e.id);saveDay(f.d);closeSheet();render();toast("Deleted");return}
  if(a==="save"){
    const text=$("etxt").value.trim();
    const nd=$("edate").value||f.d;
    const e=Object.assign({},f.e,{text,cat:$("ecat").value,sub:$("esub").value,pts:+sh.dataset.pts});
    if(nd!==f.d){S.days[f.d]=S.days[f.d].filter(x=>x.id!==e.id);saveDay(f.d);S.days[nd]=entries(nd).concat([e]);saveDay(nd)}
    else{S.days[f.d]=S.days[f.d].slice();S.days[f.d][f.i]=e;saveDay(f.d)}
    closeSheet();render();toast("Saved");
  }
});

/* ---------- events ---------- */
document.querySelector("nav").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;S.view=b.dataset.v;render();window.scrollTo(0,0)});
function keepText(fn){const t=$("txt");const v=t?t.value:"";fn();const n=$("txt");if(n)n.value=v}
function setCats(c){S.cats=c;saveCats();fixSel();render()}
$("view").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;const i=+b.dataset.i,j=+b.dataset.j;
  if(a==="prev"){S.date=addDays(S.date,-1);render()}
  else if(a==="next"){if(S.date<today()){S.date=addDays(S.date,1);render()}}
  else if(a==="kind"){S.kind=b.dataset.k;keepText(render)}
  else if(a==="pts"){S.pts=+b.dataset.p;keepText(render)}
  else if(a==="cat"){S.cat=b.dataset.c;S.sub="";fixSel();S.pts=defPts(S.cat,S.sub);keepText(render)}
  else if(a==="sub"){S.sub=b.dataset.s;S.pts=defPts(S.cat,S.sub);keepText(render)}
  else if(a==="quick"){const q=quickItems(S.cat,S.sub)[+b.dataset.k];if(!q)return;S.pts=q.pts;render();const t=$("txt");t.value=q.name;t.focus()}
  else if(a==="addquick")quickSheet(i,j);
  else if(a==="rmquick"){const k=+b.dataset.k;const c=clone(S.cats);const sub=c[i].subs[j];c[i].items[sub].splice(k,1);if(!c[i].items[sub].length)delete c[i].items[sub];setCats(c)}
  else if(a==="add")addEntry();
  else if(a==="toggle")toggleTask(b.dataset.id);
  else if(a==="edit")editSheet(b.dataset.id);
  else if(a==="goto"){S.date=b.dataset.d;S.view="today";render();window.scrollTo(0,0)}
  else if(a==="range"){S.range=+b.dataset.n;render()}
  else if(a==="expand"){S.open[b.dataset.c]=!S.open[b.dataset.c];render()}
  else if(a==="addcat"){const v=$("newcat").value.trim();if(!v||/›/.test(v))return;if(catObj(v))return toast("Already exists");setCats(S.cats.concat([{name:v,subs:[],subPts:{},items:{}}]))}
  else if(a==="rename"){const old=S.cats[i].name;textSheet("Rename category",old,v=>{
      if(v===old)return;if(catObj(v))return toast("Already exists");
      const c=clone(S.cats);c[i].name=v;if(S.cat===old)S.cat=v;
      remapEntries(e=>e.cat===old,()=>({cat:v}));setCats(c)})}
  else if(a==="rmcat"){confirmSheet(`Remove "${S.cats[i].name}"? Past entries keep their label.`,()=>setCats(S.cats.filter((_,k)=>k!==i)))}
  else if(a==="up"){if(i<1)return;const c=clone(S.cats);[c[i-1],c[i]]=[c[i],c[i-1]];setCats(c)}
  else if(a==="addsub"){textSheet(`New subcategory in ${S.cats[i].name}`,"",v=>{
      if(S.cats[i].subs.includes(v))return toast("Already exists");const c=clone(S.cats);c[i].subs.push(v);setCats(c)})}
  else if(a==="rensub"){const cat=S.cats[i].name,old=S.cats[i].subs[j];textSheet("Rename subcategory",old,v=>{
      if(v===old)return;if(S.cats[i].subs.includes(v))return toast("Already exists");
      const c=clone(S.cats);c[i].subs[j]=v;if(S.cat===cat&&S.sub===old)S.sub=v;
      if(old in c[i].subPts){c[i].subPts[v]=c[i].subPts[old];delete c[i].subPts[old]}if(c[i].items[old]){c[i].items[v]=c[i].items[old];delete c[i].items[old]}
      remapEntries(e=>e.cat===cat&&e.sub===old,()=>({sub:v}));setCats(c)})}
  else if(a==="rmsub"){confirmSheet(`Remove "${S.cats[i].subs[j]}"? Past entries keep their label.`,()=>{const c=clone(S.cats);const sub=c[i].subs[j];c[i].subs.splice(j,1);delete c[i].subPts[sub];delete c[i].items[sub];setCats(c)})}
  else if(a==="csv")downloadCSV();
  else if(a==="backup")backup();
  else if(a==="restore")$("restoreFile").click();
});
$("view").addEventListener("keydown",ev=>{
  if(ev.target.id==="txt"&&ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();addEntry()}
  if(ev.target.id==="newcat"&&ev.key==="Enter"){ev.preventDefault();$("view").querySelector('[data-act="addcat"]').click()}
});
$("view").addEventListener("input",ev=>{
  if(ev.target.id==="q"){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("q");q.focus();q.setSelectionRange(pos,pos)}
  if(ev.target.id==="txt"){ev.target.style.height="auto";ev.target.style.height=Math.min(160,ev.target.scrollHeight)+"px"}
});
$("view").addEventListener("change",ev=>{const f=ev.target.dataset.f;if(f){S[f]=ev.target.value;render();return}
  const ps=ev.target.dataset.ptsel;if(ps!=null){const i=+ps,j=+ev.target.dataset.j;const c=clone(S.cats);const p=+ev.target.value;const sub=c[i].subs[j];
    if(p===BASE_PTS)delete c[i].subPts[sub];else c[i].subPts[sub]=p;setCats(c);toast(`${sub} now starts at ${sgn(p)}`)}});
function download(name,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
}
function lastBackup(){let t=null;try{t=localStorage.getItem(LS+".lastBackup")}catch(e){}return t?" Last backup: "+esc(nice(t,{month:"short",day:"numeric",year:"numeric"}))+".":" No backup yet."}
function backup(){
  download(`progress-log-backup-${today()}.json`,JSON.stringify({app:"progress-log",version:2,exported:new Date().toISOString(),cats:S.cats,days:S.days},null,1),"application/json");
  try{localStorage.setItem(LS+".lastBackup",today())}catch(e){}render();toast("Backup downloaded");
}
document.addEventListener("change",ev=>{
  if(ev.target.id!=="restoreFile")return;const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    let o;try{o=JSON.parse(r.result)}catch(e){return toast("That file isn't a backup")}
    if(!o||typeof o.days!=="object")return toast("That file isn't a backup");
    let n=0;const days={};for(const d in o.days)if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(o.days[d])&&o.days[d].length){days[d]=o.days[d].map(norm);n+=days[d].length}
    confirmSheet(`Replace what's on this device with the backup (${n} entries)?`,()=>{
      S.days=days;if(Array.isArray(o.cats)&&o.cats.length)S.cats=normCats(o.cats);fixSel();lsSave();setStatus(statusLine());render();toast("Restored "+n+" entries")});
    const y=$("sheet").querySelector('[data-sact="yes"]');if(y)y.textContent="Restore";
  };r.readAsText(f);ev.target.value="";
});
function downloadCSV(){
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=[["date","category","subcategory","points","text"]];
  Object.keys(S.days).sort().forEach(d=>S.days[d].forEach(e=>rows.push([d,e.cat,e.sub,e.pts,e.text])));
  download(`progress-log-${today()}.csv`,rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv");toast(`Downloaded ${rows.length-1} entries`);
}
init();
})();
</script>
</body>
</html>
